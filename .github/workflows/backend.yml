name: Backend checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Scan Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Validate deployment files
        run: |
          sh -n entrypoint.sh deploy/deploy.sh deploy/backup.sh deploy/restore.sh
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
          docker run --rm \
            --env API_DOMAIN=api.example.com \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.6-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build production images
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml build couchdb backend

      - name: Smoke test production services
        run: |
          trap 'docker compose --env-file .env.production.example -f docker-compose.prod.yml down --volumes' EXIT
          docker compose --env-file .env.production.example -f docker-compose.prod.yml up --detach --no-build --wait couchdb backend
          docker compose --env-file .env.production.example -f docker-compose.prod.yml exec --no-TTY backend \
            curl --fail --silent http://127.0.0.1:3000/api/health/ready
          docker compose --env-file .env.production.example -f docker-compose.prod.yml exec --no-TTY backend \
            curl --fail --silent \
              --header 'Content-Type: application/json' \
              --data '{"email":"admin@example.com","password":"replace-with-Strong-Admin-Password-42!"}' \
              http://127.0.0.1:3000/api/auth/login
