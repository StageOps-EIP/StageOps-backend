name: Backend checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Scan Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Validate deployment files
        run: |
          sh -n entrypoint.sh deploy/deploy.sh deploy/backup.sh deploy/restore.sh
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Build production image
        run: |
          docker build --tag stageops-couchdb:ci --file deploy/couchdb/Dockerfile .
          docker build --tag stageops-backend:ci .
