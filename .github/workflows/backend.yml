name: Backend checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OFFLINE_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Scan Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Validate deployment files
        run: |
          sh -n entrypoint.sh deploy/deploy.sh deploy/backup.sh deploy/restore.sh \
            deploy/migrate-theatre.sh deploy/migrate-theatre-container.sh
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
          docker run --rm \
            --env API_DOMAIN=api.example.com \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.6-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build production images
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml build couchdb backend

      - name: Smoke test production services
        run: |
          compose_files='-f docker-compose.prod.yml -f .github/docker-compose.integration.yml'
          trap 'docker compose --env-file .env.production.example -f docker-compose.prod.yml -f .github/docker-compose.integration.yml down --volumes' EXIT
          docker compose --env-file .env.production.example $compose_files up --detach --no-build --wait couchdb backend
          docker compose --env-file .env.production.example $compose_files exec --no-TTY backend \
            curl --fail --silent http://127.0.0.1:3000/api/health/ready
          docker compose --env-file .env.production.example $compose_files exec --no-TTY backend \
            curl --fail --silent \
              --header 'Content-Type: application/json' \
              --data '{"email":"admin@example.com","password":"replace-with-Strong-Admin-Password-42!"}' \
              http://127.0.0.1:3000/api/auth/login
          couch_url='http://127.0.0.1:15984'
          couch_auth='stageops_admin:replace-with-at-least-32-random-characters'
          curl --fail --silent --user "$couch_auth" --request PUT \
            --header 'Content-Type: application/json' \
            --data '{"_id":"user::legacy","type":"user","email":"legacy@example.com","password_hash":"legacy-hash","role":"son"}' \
            "$couch_url/stageops/user::legacy" >/dev/null
          curl --fail --silent --user "$couch_auth" --request PUT \
            --header 'Content-Type: application/json' \
            --data '{"_id":"module::son","type":"module","name":"son","active":false}' \
            "$couch_url/stageops/module::son" >/dev/null
          docker compose --env-file .env.production.example $compose_files run --rm --no-deps \
            --entrypoint /app/migrate-theatre.sh backend --confirm
          docker compose --env-file .env.production.example $compose_files run --rm --no-deps \
            --entrypoint /app/migrate-theatre.sh backend --confirm
          curl --fail --silent --user "$couch_auth" "$couch_url/stageops_auth/user::legacy" \
            | jq -e '.email == "legacy@example.com" and .theatre_id == "replace-with-theatre-id"'
          curl --fail --silent --user "$couch_auth" \
            "$couch_url/stageops/module::replace-with-theatre-id::son" \
            | jq -e '.active == false and .theatre_id == "replace-with-theatre-id"'
          COUCHDB_TEST_URL=http://127.0.0.1:15984 \
          COUCHDB_TEST_USER=stageops_admin \
          COUCHDB_TEST_PASSWORD=replace-with-at-least-32-random-characters \
            go test -race -tags=integration ./internal/auth
